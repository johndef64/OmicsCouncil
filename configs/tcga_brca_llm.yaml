  source: pkt_subset
modalities:
  cnv: {}
  met: {}
  mir: {}
  rna: {}
reference_markers:
- ESR1
- ERBB2
- MKI67
- BCL2
- FOXA1
- MLPH
- KRT5
- KRT17
- GATA3
- PGR
- EGFR
relations:
- elevated_in
- reduced_in
seed: 42
test_size: 0.3
